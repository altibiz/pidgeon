# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

services:
  postgres:
    image: timescale/timescaledb-ha:pg14-latest
    restart: always
    volumes:
      - postgres_data:/home/postgres/pgdata/data
    environment:
      - POSTGRES_DB=pidgeon
      - POSTGRES_USER=pidgeon
      - POSTGRES_PASSWORD=pidgeon
    ports:
      - 5433:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d pidgeon -U pidgeon"]
      interval: 1m
      timeout: 10s
      retries: 10

  grafana:
    image: grafana/grafana:11.3.1
    ports: ["3000:3000"]
    volumes:
      - ./assets/grafana/dev/datasource.yml:/etc/grafana/provisioning/datasources/pidgeon.yml:ro
      - ./assets/grafana/dev/dashboards.yml:/etc/grafana/provisioning/dashboards/pidgeon.yml:ro
      - ./assets/grafana/dashboards:/etc/grafana/dashboards/pidgeon:ro
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
